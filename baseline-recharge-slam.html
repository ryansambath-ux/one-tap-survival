D TO FLOAT</div><div id="menu"><div class="panel"><h1>ONE TAP<br>SURVIVAL 3D</h1><p id="status">Energy Orb Edition · v0.3<br>Third-person chase camera</p><p>Swipe to dodge steel barriers. Tap to jump. Hold to float. Avoid ceiling hazards.</p><button id="play">PLAY</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});const quality={dpr:Math.min(devicePixelRatio||1,2.5),minDpr:.8,frames:0,elapsed:0};renderer.setPixelRatio(quality.dpr);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);document.getElementById('loading').remove();

case 3:add(big*.38,5,1.5,-big*.32,2.5);add(big*.38,5,1.5,big*.32,2.5);add(big,.5,1.5,0,5.2);break;
case 4:add(.7,4.4,1.4,0,3);add(big*.7,.6,1.4,0,3);break;
case 5:{const pyramid=new THREE.Mesh(new THREE.ConeGeometry(wide?3.3:1.8,wide?4.1:2.6,4),darkMetal);pyramid.position.y=wide?2.05:1.3;pyramid.rotation.y=Math.PI/4;group.add(pyramid);const edges=new THREE.LineSegments(new THREE.EdgesGeometry(pyramid.geometry),matEdge);pyramid.add(edges);parts.push({m:pyramid,w:wide?6.6:3.6,h:wide?4.1:2.6,d:2,px:0,py:wide?2.05:1.3,pyramid:true});break}

case 7:add(big*.43,3.2,1.4,-big*.27,1.6);add(big*.43,3.2,1.4,big*.27,1.6);break;

const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const rawDt=clock.getDelta(),dt=Math.min(rawDt,.0333);quality.frames++;quality.elapsed+=rawDt;if(quality.elapsed>=3){const fps=quality.frames/quality.elapsed;if(fps<42&&quality.dpr>quality.minDpr){quality.dpr=Math.max(quality.minDpr,quality.dpr*.84);renderer.setPixelRatio(quality.dpr)}else if(fps>57&&quality.dpr<Math.min(devicePixelRatio||1,2.5)){quality.dpr=Math.min(devicePixelRatio||1,2.5,quality.dpr*1.08);renderer.setPixelRatio(quality.dpr)}quality.frames=0;quality.elapsed=0}if(playing){recharge=Math.min(100,recharge+dt*100/rechargeSeconds);updateRecharge();distance+=speed*dt;score+=dt*10;const nextStage=Math.floor(score/150);if(nextStage!==stageIndex){stageIndex=nextStage;stageTag.textContent=stages[stageIndex%4].name+' · LEVEL '+(stageIndex+1)}speed=Math.min(58,16+8*(score/50));document.getElementById('score').textContent=Math.floor(score);if(holding&&dy>0&&holdTime<.5){dy+=21*dt;holdTime+=dt}dy-=23*dt;y+=dy*dt;if(y<.7){y=.7;dy=0}if(y>8.9){y=8.9;dy=Math.min(0,dy)}x=THREE.MathUtils.damp(x,targetX,12,dt);orbGroup.position.set(x,y,3);orb.rotation.x-=speed*dt/.69;surfaceMarks.rotation.z+=dt*.23;for(const line of laneLines){line.position.z+=speed*dt;if(line.position.z>13)line.position.z-=203}for(const line of crossGrid){line.position.z+=speed*dt;if(line.position.z>13)line.position.z-=204}for(const item of sideStructures){item.body.position.z+=speed*dt;item.lamp.position.z+=speed*dt;if(item.body.position.z>18){item.body.position.z-=330;item.lamp.position.z-=330}}spawnCountdown-=speed*dt;if(spawnCountdown<=0){spawn();spawnCountdown=27+Math.random()*14}for(const o of obstacles){o.group.position.z+=speed*dt;const z=o.group.position.z;if(o.kind===4)o.group.rotation.z+=dt*.65;if(o.kind===9)o.group.position.x=o.center+Math.sin(distance*.06+o.phase)*.9;if(o.kind===11)o.group.rotation.x+=dt*1.4;if(playing&&Math.abs(z-3)<1.55){for(const p of o.parts){const px=o.group.position.x+p.px,half=p.w/2;if(p.ring){const dx=Math.abs(x-px),vertical=Math.abs(y-p.py);if(Math.hypot(dx,vertical)>half-.65&&Math.hypot(dx,vertical)<half+.65)hitObstacle(o);continue}const dx=Math.abs(x-px),dy=Math.abs(y-p.py);const effectiveW=p.angle?Math.abs(Math.cos(p.angle))*p.w+Math.abs(Math.sin(p.angle))*p.h:p.w;const effectiveH=p.angle?Math.abs(Math.sin(p.angle))*p.w+Math.abs(Math.cos(p.angle))*p.h:p.h;if(dx<effectiveW/2+.45&&dy<effectiveH/2+.45){if(p.pyramid){const relative=Math.max(0,1-(y+.2)/p.h);if(dx<(p.w/2)*relative+.25)hitObstacle(o)}else if(p.angle){const lx=(x-px)*Math.cos(p.angle)+(y-p.py)*Math.sin(p.angle),ly=-(x-px)*Math.sin(p.angle)+(y-p.py)*Math.cos(p.angle);if(Math.abs(lx)<p.w/2+.4&&Math.abs(ly)<p.h/2+.4)hitObstacle(o)}else hitObstacle(o)}}}if(z>15){disposeObstacle(o);o.passed=true}}obstacles=obstacles.filter(o=>!o.passed);camera.position.x=THREE.MathUtils.damp(camera.position.x,x*.57,3.8,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,3.7+y*.16,3.4,dt);camera.lookAt(x*.4,1.7,-24)}
if(dead){deathTimer+=dt;if(deathTimer>1.05){dead=false;document.getElementById('status').textContent='SCORE '+Math.floor(score)+' · BEST '+best;document.getElementById('play').textContent='RETRY';document.getElementById('menu').classList.remove('hidden')}}

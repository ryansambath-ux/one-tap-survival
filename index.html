<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10102e"><link rel="manifest" href="manifest.webmanifest"><title>One Tap Survival</title><style>*{box-sizing:border-box}body{margin:0;background:#090b23;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;font-weight:900;pointer-events:none;text-shadow:0 2px 8px #000}#help{position:fixed;bottom:16px;width:100%;text-align:center;font-size:12px;opacity:.8;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#080b22aa;text-align:center}#overlay.hidden{display:none}.panel{padding:30px;border:1px solid #42e6ff88;border-radius:22px;background:#151637ee;box-shadow:0 0 55px #5a42ff66;max-width:88vw}h1{color:#8deeff;font-size:30px;line-height:1.05}button{border:0;border-radius:30px;padding:13px 35px;background:linear-gradient(110deg,#26dfff,#925dff);font-weight:900;color:#10102e;font-size:18px}small{display:block;margin:16px 0 24px;color:#c4c4e9}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">0</span><span id="best">BEST 0</span></div><div id="help">TAP: JUMP · DOUBLE TAP: REVERSE GRAVITY</div><div id="overlay"><div class="panel"><h1>ONE TAP<br>SURVIVAL</h1><p id="message">Jump. Flip. Survive.</p><small>Tap once to jump · Double tap to reverse gravity</small><button id="start">PLAY</button></div></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),msg=document.querySelector('#message');let W,H,D,floor,ceil,p,obs=[],particles=[],score=0,best=Number(localStorage.getItem('ots-best')||0),running=false,last=0,lastTap=-999,spawn=1,speed=230,elapsed=0;document.querySelector('#best').textContent='BEST '+best;const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);floor=H*.79;ceil=H*.20;if(p)p.y=Math.max(ceil+p.r,Math.min(floor-p.r,p.y))}addEventListener('resize',resize);resize();function reset(){p={x:W*.24,y:floor-15,r:15,vy:0,gravity:1};obs=[];particles=[];score=0;elapsed=0;spawn=1.3;speed=230;lastTap=-999;running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function tap(){if(!running)return;const t=performance.now();if(t-lastTap<270){p.gravity*=-1;p.vy=p.gravity*210;lastTap=-999;for(let i=0;i<18;i++)particles.push({x:p.x,y:p.y,vx:rnd(-120,120),vy:rnd(-140,140),life:.5})}else{p.vy=-p.gravity*410;lastTap=t}}c.addEventListener('pointerdown',e=>{e.preventDefault();tap()});document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();running?tap():reset()}});function end(){running=false;let s=Math.floor(score);if(s>best){best=s;localStorage.setItem('ots-best',best)}document.querySelector('#best').textContent='BEST '+best;msg.textContent='SCORE '+s+' · BEST '+best;document.querySelector('#start').textContent='RETRY';overlay.classList.remove('hidden')}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;elapsed+=dt;speed=Math.min(430,230+elapsed*3.2);score+=dt*10;document.querySelector('#score').textContent=Math.floor(score);p.vy+=p.gravity*1050*dt;p.y+=p.vy*dt;if(p.y+p.r>floor){p.y=floor-p.r;if(p.vy>0)p.vy=0}if(p.y-p.r<ceil){p.y=ceil+p.r;if(p.vy<0)p.vy=0}spawn-=dt;if(spawn<=0){let side=Math.random()<.5?'floor':'ceiling';obs.push({x:W+35,side,w:rnd(26,42),h:rnd(24,39)});spawn=rnd(1,1.6)*230/speed}for(const o of obs){o.x-=speed*dt;let top=o.side==='floor'?floor-o.h:ceil;if(p.x+p.r*.72>o.x&&p.x-p.r*.72<o.x+o.w&&p.y+p.r*.72>top&&p.y-p.r*.72<top+o.h){draw();end();return}}obs=obs.filter(o=>o.x+o.w>-30);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);draw();requestAnimationFrame(loop)}function draw(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10133b');bg.addColorStop(.5,'#24134d');bg.addColorStop(1,'#0a1939');g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='#7779e688';for(let i=0;i<23;i++){let x=((i*117-elapsed*9)%(W+180)+W+180)%(W+180),y=H*(.06+(i*31%85)/100);g.fillRect(x,y,2,2)}for(let layer=0;layer<3;layer++){g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+25;x+=25){let y=H*(.58+layer*.065)-Math.abs(Math.sin((x+elapsed*(8+layer*9))/100+layer*2))*H*(.15-layer*.027);g.lineTo(x,y)}g.lineTo(W,H);g.fillStyle=['#241751','#171843','#101631'][layer];g.fill()}g.fillStyle='#091329';g.fillRect(0,0,W,ceil);g.fillRect(0,floor,W,H-floor);g.shadowColor='#3be9ff';g.shadowBlur=16;g.strokeStyle='#45e8ff';g.lineWidth=3;g.beginPath();g.moveTo(0,ceil);g.lineTo(W,ceil);g.moveTo(0,floor);g.lineTo(W,floor);g.stroke();g.shadowBlur=0;for(const o of obs){let y=o.side==='floor'?floor-o.h:ceil;g.shadowColor='#ff3b9b';g.shadowBlur=16;g.fillStyle='#ff4a9e';g.beginPath();g.moveTo(o.x,y+(o.side==='floor'?o.h:0));g.lineTo(o.x+o.w/2,y+(o.side==='floor'?0:o.h));g.lineTo(o.x+o.w,y+(o.side==='floor'?o.h:0));g.closePath();g.fill();g.shadowBlur=0}for(const q of particles){g.globalAlpha=q.life*2;g.fillStyle='#50f5ff';g.fillRect(q.x,q.y,4,4)}g.globalAlpha=1;g.save();g.translate(p.x,p.y);g.shadowColor='#49eaff';g.shadowBlur=25;g.fillStyle='#b6f7ff';g.beginPath();g.roundRect(-p.r,-p.r,p.r*2,p.r*2,6);g.fill();g.shadowBlur=0;g.fillStyle='#1d2761';g.fillRect(-7,-4,4,8);g.fillRect(4,-4,4,8);g.restore()}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

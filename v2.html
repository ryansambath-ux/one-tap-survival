<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10102e"><link rel="manifest" href="manifest.webmanifest"><title>One Tap Survival v0.2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080a22;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}#score{font-size:30px}#best{font-size:14px;color:#8efaff}#hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.6px;opacity:.8;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#07091cb8;text-align:center}#overlay.hidden{display:none}.panel{padding:28px 25px;border:1px solid #46ecff88;border-radius:22px;background:#151637f5;box-shadow:0 0 55px #6a42ff66;max-width:90vw}h1{font-size:31px;line-height:1.05;color:#a7f8ff;margin:0 0 15px}p{margin:8px 0}small{display:block;margin:15px 0 23px;color:#c9c7ec}button{border:0;border-radius:30px;padding:14px 38px;background:linear-gradient(110deg,#2de8ff,#af64ff);font-weight:900;color:#10102e;font-size:18px}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span id="score">0</span><span id="best">BEST 0</span></div><div id="hint">TAP TO JUMP · DOUBLE TAP TO FLIP GRAVITY</div><div id="overlay"><div class="panel"><h1>ONE TAP<br>SURVIVAL</h1><p id="message">ENERGY ORB EDITION · v0.2</p><small>Tap: instant jump · Double tap: reverse gravity<br>Survive the steel columns and energy beams</small><button id="start">PLAY</button></div></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,dpr=1,floor=0,ceiling=0,orb=null,obstacles=[],trail=[],sparks=[],world=0,camera=0,speed=230,elapsed=0,spawnAt=0,score=0,alive=false,exploding=false,lastTime=0,lastTap=-1000,shake=0,flash=0,deathTime=0;
let best=0;try{best=Number(localStorage.getItem('ots-best')||0)}catch(e){}bestEl.textContent='BEST '+best;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ceiling=H*.19;floor=H*.80;if(orb)orb.y=clamp(orb.y,ceiling+orb.r,floor-orb.r)}
addEventListener('resize',resize);resize();
function start(){world=0;camera=0;speed=230;elapsed=0;score=0;spawnAt=370;obstacles=[];trail=[];sparks=[];orb={x:W*.25,y:floor-16,r:16,vy:0,gravity:1,angle:0};alive=true;exploding=false;lastTap=-1000;shake=0;flash=0;overlay.classList.add('hidden');lastTime=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',start);
function input(){if(!alive)return;const now=performance.now();if(now-lastTap<265){orb.gravity*=-1;orb.vy=orb.gravity*175;lastTap=-1000;flash=.24;burst(orb.x,orb.y,14,['#ff5ff4','#63eaff','#fff'],135)}else{orb.vy=-orb.gravity*425;lastTap=now;burst(orb.x,orb.y,6,['#58eaff','#ff5ed9'],65)}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();input()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();alive?input():!exploding&&start()}});
function burst(x,y,n,colors,power){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(power*.2,power);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.8),max:.8,r:rand(1.5,4.5),color:colors[i%colors.length]})}}
function addObstacle(){const gap=floor-ceiling;const side=Math.random()<.5?'floor':'ceiling';const kind=elapsed>30&&Math.random()<.32?'beam':'column';const h=kind==='beam'?rand(gap*.29,gap*.51):rand(gap*.16,gap*.43);const width=kind==='beam'?rand(45,82):rand(27,54);const x=world+W+110;obstacles.push({x,side,kind,h,w:width,passed:false});const minGap=Math.max(180,speed*.9);spawnAt=x+width+rand(minGap,minGap+120)}
function crash(){alive=false;exploding=true;deathTime=0;shake=13;flash=.35;burst(orb.x,orb.y,65,['#58eaff','#ff4ddc','#f9faff','#a46bff','#66ffc9'],280);trail.push({x:orb.x,y:orb.y,life:.5});const s=Math.floor(score);if(s>best){best=s;try{localStorage.setItem('ots-best',best)}catch(e){}}bestEl.textContent='BEST '+best}
function finish(){exploding=false;message.textContent='SCORE '+Math.floor(score)+' · BEST '+best;document.getElementById('start').textContent='RETRY';overlay.classList.remove('hidden')}
function loop(now){if(!alive&&!exploding)return;const dt=Math.min((now-lastTime)/1000,.033);lastTime=now;if(alive){elapsed+=dt;speed=Math.min(510,230+elapsed*4.1);world+=speed*dt;camera=world-W*.25;score+=dt*10;scoreEl.textContent=Math.floor(score);orb.vy+=orb.gravity*1070*dt;orb.y+=orb.vy*dt;orb.angle+=speed*dt/orb.r*(orb.gravity===1?1:-1);orb.x=W*.25+Math.min(28,elapsed*.28);if(orb.y+orb.r>=floor){orb.y=floor-orb.r;if(orb.vy>0)orb.vy=0}if(orb.y-orb.r<=ceiling){orb.y=ceiling+orb.r;if(orb.vy<0)orb.vy=0}trail.unshift({x:orb.x,y:orb.y,life:.55});if(trail.length>32)trail.pop();if(world+W>=spawnAt)addObstacle();for(const o of obstacles){const x=o.x-camera,y=o.side==='floor'?floor-o.h:ceiling;if(orb.x+orb.r*.74>x&&orb.x-orb.r*.74<x+o.w&&orb.y+orb.r*.74>y&&orb.y-orb.r*.74<y+o.h){crash();break}}obstacles=obstacles.filter(o=>o.x-camera+o.w>-100)}else{deathTime+=dt;if(deathTime>.9)finish()}for(const t of trail)t.life-=dt;trail=trail.filter(t=>t.life>0);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.975;s.vy*=.975;s.life-=dt}sparks=sparks.filter(s=>s.life>0);shake=Math.max(0,shake-35*dt);flash=Math.max(0,flash-dt);draw();if(alive||exploding)requestAnimationFrame(loop)}
function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1235');bg.addColorStop(.55,'#281248');bg.addColorStop(1,'#091936');ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
for(let i=0;i<35;i++){let x=((i*109-world*.08)%(W+160)+W+160)%(W+160),y=H*(.04+(i*37%88)/100);ctx.fillStyle=i%3?'#6c66c4aa':'#c59affaa';ctx.fillRect(x,y,1.5,1.5)}
for(let layer=0;layer<3;layer++){ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+30;x+=22){let y=H*(.58+layer*.07)-Math.abs(Math.sin((x+world*(.035+layer*.025))/115+layer*1.7))*H*(.15-layer*.027);ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.fillStyle=['#291a55','#1b1a49','#101833'][layer];ctx.fill()}
ctx.fillStyle='#09152c';ctx.fillRect(0,0,W,ceiling);ctx.fillRect(0,floor,W,H-floor);ctx.shadowColor='#32eaff';ctx.shadowBlur=16;ctx.strokeStyle='#4beaff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ceiling);ctx.lineTo(W,ceiling);ctx.moveTo(0,floor);ctx.lineTo(W,floor);ctx.stroke();ctx.shadowBlur=0;
for(const o of obstacles){const x=o.x-camera,y=o.side==='floor'?floor-o.h:ceiling;if(x>W+80||x+o.w<0)continue;ctx.shadowColor='#ff4aaf';ctx.shadowBlur=13;const metal=ctx.createLinearGradient(x,0,x+o.w,0);metal.addColorStop(0,'#28334f');metal.addColorStop(.28,'#75829a');metal.addColorStop(.53,'#303b59');metal.addColorStop(1,'#111a32');ctx.fillStyle=metal;ctx.fillRect(x,y,o.w,o.h);ctx.shadowBlur=0;ctx.strokeStyle='#ff5baf';ctx.lineWidth=2;ctx.strokeRect(x,y,o.w,o.h);ctx.fillStyle='#ff67b9';const stripeY=o.side==='floor'?y+6:y+o.h-10;ctx.fillRect(x+3,stripeY,o.w-6,4);ctx.strokeStyle='#94a6c4aa';ctx.lineWidth=2;for(let k=12;k<o.h-10;k+=23){ctx.beginPath();ctx.moveTo(x+5,y+k);ctx.lineTo(x+o.w-5,y+k);ctx.stroke()}if(o.kind==='beam'){ctx.fillStyle='#ff4e9c';ctx.fillRect(x+o.w*.43,y,4,o.h)}}
if(alive){ctx.save();ctx.translate(orb.x,orb.y);ctx.rotate(orb.angle);ctx.shadowColor='#e45bff';ctx.shadowBlur=24;const gradient=ctx.createRadialGradient(-6,-7,2,0,0,orb.r+3);gradient.addColorStop(0,'#fff');gradient.addColorStop(.22,'#d9ffff');gradient.addColorStop(.45,'#7de9ff');gradient.addColorStop(.72,'#ba65ff');gradient.addColorStop(1,'#fa54e0');ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(0,0,orb.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffffbb';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,orb.r-3,-2.7,-.45);ctx.stroke();ctx.restore()}
for(const s of sparks){ctx.globalAlpha=Math.min(1,s.life/.35);ctx.shadowColor=s.color;ctx.shadowBlur=12;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;if(flash){ctx.fillStyle='rgba(195,104,255,'+(flash*.24)+')';ctx.fillRect(0,0,W,H)}ctx.restore()}
draw();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

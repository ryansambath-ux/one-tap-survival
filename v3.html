<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b20"><title>One Tap Survival 3D · v0.3</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#080b20;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 9px black;pointer-events:none}#score{font-size:29px}#best{color:#b0faff}#help{position:fixed;bottom:18px;width:100%;text-align:center;color:#e1eaff;font-size:12px;text-shadow:0 2px 5px #000;pointer-events:none}#menu{position:fixed;inset:0;background:#06091fc9;display:grid;place-items:center;text-align:center}#menu.hidden{display:none}.panel{background:#121934ed;border:1px solid #60e7ff99;box-shadow:0 0 55px #6a4eff66;border-radius:22px;padding:28px 22px;width:min(90vw,380px)}h1{margin:0;color:#b8f8ff;line-height:1.04}p{line-height:1.5;color:#d2d6f5}button{background:linear-gradient(100deg,#36f5ff,#b674ff);color:#0a0c26;border:0;border-radius:50px;font-size:18px;font-weight:900;padding:13px 38px}#loading{position:fixed;inset:0;background:#090e24;display:grid;place-items:center;color:#abf8ff;font-weight:800}</style></head><body><div id="loading">LOADING 3D WORLD…</div><div id="hud"><span id="score">0</span><span id="best">BEST 0</span></div><div id="help">SWIPE LEFT / RIGHT TO STEER · TAP TO JUMP · HOLD TO FLOAT</div><div id="menu"><div class="panel"><h1>ONE TAP<br>SURVIVAL 3D</h1><p id="status">Energy Orb Edition · v0.3<br>Third-person chase camera</p><p>Swipe to dodge steel barriers. Tap to jump. Hold to float. Avoid ceiling hazards.</p><button id="play">PLAY</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});const quality={dpr:Math.min(devicePixelRatio||1,2.5),minDpr:.8,frames:0,elapsed:0};renderer.setPixelRatio(quality.dpr);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);document.getElementById('loading').remove();
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,220);camera.position.set(0,4.2,9.7);scene.fog=new THREE.FogExp2(0x0d1233,.006);
const ambient=new THREE.HemisphereLight(0x91baff,0x151229,2.2);scene.add(ambient);const key=new THREE.PointLight(0x4fefff,100,24);key.position.set(-3,6,5);scene.add(key);const pink=new THREE.PointLight(0xff56e8,70,20);pink.position.set(4,5,-7);scene.add(pink);
const mat=(color,metalness=.5,roughness=.35)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const trackMat=mat(0x18233c,.72,.28),metal=mat(0x71829c,.85,.24),darkMetal=mat(0x26334b,.8,.3);

const track=mesh(new THREE.BoxGeometry(11,.36,260),trackMat,0,-.25,-100);

const rails=[];for(let x of [-5.55,5.55]){rails.push(mesh(new THREE.BoxGeometry(.13,.16,260),glowMat(0x48eaff),x,.02,-100));rails.push(mesh(new THREE.BoxGeometry(.1,.13,260),glowMat(0x6a75ff),x,10.35,-100))}
const laneLines=[];for(let z=-185;z<15;z+=7){for(let x of [-1.85,1.85])laneLines.push(mesh(new THREE.BoxGeometry(.07,.018,2.2),glowMat(0x3a91ff),x,-.056,z))}
const orbGroup=new THREE.Group();scene.add(orbGroup);const orbMat=new THREE.MeshPhysicalMaterial({color:0xa5f7ff,metalness:.65,roughness:.08,clearcoat:1,clearcoatRoughness:.05,iridescence:1,iridescenceIOR:1.4,iridescenceThicknessRange:[100,750],emissive:0x2349a8,emissiveIntensity:.34});const orb=new THREE.Mesh(new THREE.SphereGeometry(.69,64,48),orbMat);orbGroup.add(orb);const core=mesh(new THREE.SphereGeometry(.48,24,16),new THREE.MeshBasicMaterial({color:0x92ffff,transparent:true,opacity:.14}),0,0,0);orbGroup.add(core);core.position.set(0,0,0);scene.remove(core);
const surfaceMarks=new THREE.Group();orb.add(surfaceMarks);const markMat=new THREE.MeshBasicMaterial({color:0xff6bdc,transparent:true,opacity:.88});for(let i=0;i<5;i++){const mark=new THREE.Mesh(new THREE.TorusGeometry(.696,.022,6,80),markMat);mark.rotation.set(i*.51,i*.68,i*.39);surfaceMarks.add(mark)}const glint=new THREE.Mesh(new THREE.SphereGeometry(.105,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));glint.position.set(.37,.39,.41);orb.add(glint);
const orbLight=new THREE.PointLight(0x7beeff,22,7);orbGroup.add(orbLight);
const sideStructures=[];for(let i=0;i<30;i++){const z=-i*11-8;for(const side of [-1,1]){const h=randHeight(i,side);const body=mesh(new THREE.BoxGeometry(1.4,h,1.4),darkMetal,side*8.5,h/2,z);const lamp=mesh(new THREE.BoxGeometry(1.55,.16,1.55),glowMat(0x48eaff),side*8.5,h-.3,z);sideStructures.push({body,lamp,h})}}function randHeight(i,side){return 4+((i*17+(side+1)*9)%9)}
const backdrop=[];for(let i=0;i<45;i++){const x=(Math.random()-.5)*105,z=-Math.random()*190,y=-2;const h=5+Math.random()*25;const m=mesh(new THREE.ConeGeometry(3+Math.random()*7,h,4),mat(i%2?0x151e3e:0x22204b,.2,.9),x,y+h/2,z);m.rotation.y=Math.random()*6;backdrop.push(m)}
let obstacles=[],particles=[],distance=0,speed=16,score=0,playing=false,dy=0,y=.7,targetX=0,x=0,holding=false,holdTime=0,last=performance.now(),stageHue=.56,deathTimer=0,dead=false;
let best=0;try{best=Number(localStorage.getItem('ots3d-best')||0)}catch(e){}document.getElementById('best').textContent='BEST '+best;
const geometryBox=new THREE.BoxGeometry(1,1,1),geoSpike=new THREE.ConeGeometry(.48,1.4,4);
function spawn(){const z=-83, lane=[-3.45,0,3.45][Math.floor(Math.random()*3)],kind=Math.random();let group=new THREE.Group();group.position.set(lane,0,z);const height=kind<.5?1.5+Math.random()*2.1:2.6+Math.random()*2.8;const top=kind>.78;const width=kind>.55?2.2:1.7;const column=new THREE.Mesh(geometryBox,metal);column.scale.set(width,height,1.6);column.position.y=top?10.3-height/2:height/2;group.add(column);const strip=new THREE.Mesh(geometryBox,glowMat(0xff57c4));strip.scale.set(width+.08,.12,1.7);strip.position.y=top?10.3-height+.1:height-.1;group.add(strip);const side=new THREE.Mesh(geometryBox,darkMetal);side.scale.set(.13,height,1.73);side.position.set(-width/2, column.position.y,0);group.add(side);scene.add(group);obstacles.push({group,lane,top,height,width,passed:false})}
let spawnCountdown=25;const stages=[{name:'ELECTRIC BLUE',color:0x39cfff,hue:.55},{name:'PLASMA PURPLE',color:0xb46bff,hue:.76},{name:'TOXIC GREEN',color:0x51ff91,hue:.37},{name:'SOLAR GOLD',color:0xffd453,hue:.12}];let stageIndex=0,stageColor=new THREE.Color(stages[0].color);const stageTag=document.createElement('div');stageTag.style.cssText='position:fixed;top:57px;left:15px;font-size:12px;font-weight:900;letter-spacing:1.4px;text-shadow:0 1px 8px #000;pointer-events:none';document.body.appendChild(stageTag);stageTag.textContent=stages[0].name;
function explode(){playing=false;dead=true;deathTimer=0;orbGroup.visible=false;for(let i=0;i<65;i++){const c=[0x5ff9ff,0xff62dd,0xffffff,0x9b7aff,0xffda52][i%5];const p=new THREE.Mesh(new THREE.IcosahedronGeometry(.07+Math.random()*.15,0),glowMat(c));p.position.copy(orbGroup.position);scene.add(p);particles.push({m:p,v:new THREE.Vector3((Math.random()-.5)*14,(Math.random()-.3)*14,(Math.random()-.5)*14),life:.7+Math.random()*.5})}const n=Math.floor(score);if(n>best){best=n;try{localStorage.setItem('ots3d-best',best)}catch(e){}}document.getElementById('best').textContent='BEST '+best}
function reset(){for(const o of obstacles)scene.remove(o.group);obstacles=[];for(const p of particles)scene.remove(p.m);particles=[];distance=0;speed=16;score=0;dy=0;y=.7;x=0;targetX=0;holdTime=0;holding=false;spawnCountdown=24;stageIndex=0;stageColor.set(stages[0].color);stageTag.textContent=stages[0].name;playing=true;dead=false;orbGroup.visible=true;document.getElementById('menu').classList.add('hidden');last=performance.now()}
document.getElementById('play').onclick=reset;
function jump(){if(!playing)return;if(y<.82){dy=9.5;holdTime=0}holding=true}
function release(){holding=false}
let touchX=0,touchY=0,moved=false;
renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();touchX=e.clientX;touchY=e.clientY;moved=false;jump()});
renderer.domElement.addEventListener('pointermove',e=>{if(!playing||e.buttons===0)return;const delta=e.clientX-touchX;if(Math.abs(delta)>8){moved=true;holding=false;targetX=THREE.MathUtils.clamp(targetX+delta/innerWidth*13,-3.45,3.45);touchX=e.clientX}});
renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')targetX=THREE.MathUtils.clamp(targetX-3.45,-3.45,3.45);if(e.code==='ArrowRight'||e.code==='KeyD')targetX=THREE.MathUtils.clamp(targetX+3.45,-3.45,3.45);if(e.code==='Space'){e.preventDefault();jump()}});addEventListener('keyup',e=>{if(e.code==='Space')release()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const rawDt=clock.getDelta(),dt=Math.min(rawDt,.04);quality.frames++;quality.elapsed+=rawDt;if(quality.elapsed>=3){const fps=quality.frames/quality.elapsed;if(fps<42&&quality.dpr>quality.minDpr){quality.dpr=Math.max(quality.minDpr,quality.dpr*.84);renderer.setPixelRatio(quality.dpr)}else if(fps>57&&quality.dpr<Math.min(devicePixelRatio||1,2.5)){quality.dpr=Math.min(devicePixelRatio||1,2.5,quality.dpr*1.08);renderer.setPixelRatio(quality.dpr)}quality.frames=0;quality.elapsed=0}if(playing){distance+=speed*dt;score+=dt*10;const nextStage=Math.floor(score/100);if(nextStage!==stageIndex){stageIndex=nextStage;stageTag.textContent=stages[stageIndex%4].name+' · LEVEL '+(stageIndex+1)}speed=Math.min(52,16+stageIndex*5);document.getElementById('score').textContent=Math.floor(score);if(holding&&dy>0&&holdTime<.5){dy+=21*dt;holdTime+=dt}dy-=23*dt;y+=dy*dt;if(y<.7){y=.7;dy=0}if(y>8.9){y=8.9;dy=Math.min(0,dy)}x=THREE.MathUtils.damp(x,targetX,12,dt);orbGroup.position.set(x,y,3);orb.rotation.x-=speed*dt/.69;surfaceMarks.rotation.z+=dt*.23;for(const line of laneLines){line.position.z+=speed*dt;if(line.position.z>13)line.position.z-=203}for(const item of sideStructures){item.body.position.z+=speed*dt;item.lamp.position.z+=speed*dt;if(item.body.position.z>18){item.body.position.z-=330;item.lamp.position.z-=330}}spawnCountdown-=speed*dt;if(spawnCountdown<=0){spawn();spawnCountdown=17+Math.random()*13}for(const o of obstacles){o.group.position.z+=speed*dt;const z=o.group.position.z;if(Math.abs(z-3)<1.3&&Math.abs(x-o.lane)<o.width/2+.48){if(o.top?y+.6>10.3-o.height:y-.5<o.height)explode()}if(z>15){scene.remove(o.group);o.passed=true}}obstacles=obstacles.filter(o=>!o.passed);camera.position.x=THREE.MathUtils.damp(camera.position.x,x*.57,3.8,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,3.7+y*.16,3.4,dt);camera.lookAt(x*.4,1.7,-24)}
if(dead){deathTimer+=dt;if(deathTimer>1.05){dead=false;document.getElementById('status').textContent='SCORE '+Math.floor(score)+' · BEST '+best;document.getElementById('play').textContent='RETRY';document.getElementById('menu').classList.remove('hidden')}}
for(const p of particles){p.m.position.addScaledVector(p.v,dt);p.v.y-=14*dt;p.life-=dt;p.m.scale.setScalar(Math.max(.01,p.life));if(p.life<=0){scene.remove(p.m)}}particles=particles.filter(p=>p.life>0);
const desired=new THREE.Color(stages[stageIndex%4].color);stageColor.lerp(desired,Math.min(1,dt*.55));scene.fog.color.copy(stageColor).multiplyScalar(.14);ambient.color.copy(stageColor);key.color.copy(stageColor);for(const r of rails)r.material.color.copy(stageColor);for(const item of sideStructures)item.lamp.material.color.copy(stageColor);for(const line of laneLines)line.material.color.copy(stageColor);renderer.render(scene,camera)}
frame();
